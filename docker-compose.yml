services:
  webapp:
    image: label-studio:1.13.1.20261103.1.fjs
    container_name: label_studio
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      lb_backend:
        condition: service_started
    restart: always
    environment:
      # - LABEL_STUDIO_HOST=https://aiservice.fujinet.net/lb
      - COLLECT_ANALYTICS=False
      - collect_analytics=0
      - LOCAL_FILES_SERVING_ENABLED=True # Must be set to True to use local files
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files # Must be set to /label-studio/files to use local files
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
      - LABEL_STUDIO_USERNAME=example@email.com
      - LABEL_STUDIO_PASSWORD=Abc12345
      - DJANGO_DB=default
      - POSTGRE_NAME=labelstudio
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=lb_backend
      - fflag_feat_front_lsdv_4583_multi_image_segmentation_short=1
      - ff_front_1170_outliner_030222_short=1
      - fflag_feat_front_dev_3873_labeling_ui_improvements_short=1
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # - .:/label-studio    # for dev 
      - .data/label_studio_data:/label-studio/data # App data
      - .data/imagedata/AI01:/label-studio/files/AI01 # Mount image data
      - .data/imagedata/AI05:/label-studio/files/AI05 # Mount image data
  lb_backend:
    image: postgres:14
    container_name: ls-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=labelstudio
    ports:
      - "5432:5432"
    volumes:
      - .data/postgres_data:/var/lib/postgresql/data
  opencv-segmentation:
    build:
      context: ./integrations/opencv-segmentation
    restart: unless-stopped
    env_file:
      - path: ./.data/label_studio_data/opencv.env
        required: false
    environment:
      LABEL_STUDIO_URL: http://webapp:8080
      ALLOWED_IMAGE_HOSTS: webapp,${OPENCV_ALLOWED_IMAGE_HOSTS:-}
      DEFAULT_RING_WIDTH: ${OPENCV_RING_WIDTH:-4}
      IMAGE_FETCH_TIMEOUT: ${OPENCV_IMAGE_FETCH_TIMEOUT:-45}
      MAX_IMAGE_BYTES: ${OPENCV_MAX_IMAGE_BYTES:-20971520}
      MAX_IMAGE_PIXELS: ${OPENCV_MAX_IMAGE_PIXELS:-40000000}
      WEB_CONCURRENCY: ${OPENCV_WEB_CONCURRENCY:-2}
    expose:
      - "9090"
    volumes:
      - .data/label_studio_data:/label-studio/data
      - .data/imagedata/AI01:/label-studio/files/AI01
      - .data/imagedata/AI05:/label-studio/files/AI05
